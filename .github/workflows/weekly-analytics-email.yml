name: Weekly Analytics Email

on:
  schedule:
    # 05:20 UTC every Monday — just after Eastern midnight, once Sunday's plays are in.
    - cron: '20 5 * * 1'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: summarize
        run: npx --yes tsx scripts/send-weekly-analytics-email.ts

      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Weatherle <${{ secrets.GMAIL_ADDRESS }}>
          to: jpbruck23@gmail.com
          subject: 'Weatherle weekly analytics'
          body: ${{ steps.summarize.outputs.summary }}
